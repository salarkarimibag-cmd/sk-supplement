# Backs up the production database every night, because the free Atlas tier
# (M0) takes no backups of its own.
#
# The repository is public, and so are its workflow artifacts, so the backup
# is encrypted (AES-256, gpg) before it is uploaded. Without BACKUP_PASSPHRASE
# the file is useless: keep the passphrase somewhere safe outside GitHub.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   MONGODB_URI        connection string of a read-only Atlas user
#   BACKUP_PASSPHRASE  long random passphrase used to encrypt the backup
#
# To restore: download the artifact from the run's page, then
#   gpg --decrypt --output backup.tar.gz sk-supplement-backup.tar.gz.gpg
#   mkdir -p backups && tar -xzf backup.tar.gz -C backups
#   npm run restore-db -- backups/sk-supplement-<date> <new database name>
name: Database backup

on:
  schedule:
    # 23:30 UTC = 03:00 in Tehran, when the shop is quietest. GitHub may
    # start scheduled runs some minutes late.
    - cron: "30 23 * * *"
  # Adds a "Run workflow" button on the Actions tab, to test it or to take
  # a backup right before a risky change.
  workflow_dispatch:

# The job only reads the code; it needs no write access to the repository.
permissions:
  contents: read

# Never run two backups at the same time.
concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      # Fail loudly instead of uploading nothing, or an unencrypted file.
      - name: Check secrets
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the MONGODB_URI and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Back up the production database
        run: npm run backup-db -- sk-supplement

      # The passphrase goes in through stdin, so it never appears on a
      # command line or in the log.
      - name: Compress and encrypt
        run: |
          tar -czf backup.tar.gz -C backups .
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output sk-supplement-backup.tar.gz.gpg backup.tar.gz
          rm -rf backups backup.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sk-supplement-backup-${{ github.run_number }}
          path: sk-supplement-backup.tar.gz.gpg
          if-no-files-found: error
          # Keep two weeks of nightly backups; older ones are deleted.
          retention-days: 14
